title: GitHub 入門與協作實作
shortTitle: GitHub 入門
cover: /courses/git-github/cover.svg
order: 1
tagline: 軟體專案與團隊協作的基礎
description: 從建立自己的 Repo 開始，練習保存版本、建立分支與提出 Pull Request。讓 AI 幫你寫的程式，也能自己管理與合作。
audience: 適合零程式基礎
duration: 150
tags:
  - 開發入門
  - 動手練習
topics:
  - Git Basics
  - Commit
  - Branch
  - Pull Request
learningGoals:
  - 建立自己的 Repo，將專案 Clone 到本機。
  - 用 Commit 與 Push 保存並同步修改。
  - 建立分支、提出 Pull Request，完成 Review 與合併。
prerequisites:
  - 準備 GitHub 帳號，並在電腦安裝 Git 與 VS Code。
  - 不需要程式基礎，帶著自己的電腦與瀏覽器即可開始。
